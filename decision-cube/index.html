 ps.forEach((p,i)=>{const m=p.m,g=pieces[i].group;g.position.set(...p.p.map(v=>v*1.01));g.setRotationFromMatrix(new T.Matrix4().set(m[0],m[1],m[2],0,m[3],m[4],m[5],0,m[6],m[7],m[8],0,0,0,0,1))});
 const settle=smooth(Math.max(0,Math.min(1,(storyTime-6.3)/1.4)));cube.rotation.set(.45+settle*.035,-.50+settle*.015,-.025+settle*.025);cube.position.y=.10;
 const reveal=smooth(Math.max(0,Math.min(1,(storyTime-8.1)/.8)));root.querySelector('h2').style.opacity=1-reveal;root.querySelector('.endline').style.opacity=reveal;
 slider.value=t;output.value=`${t.toFixed(1)}s / 10s`;renderer.render(scene,camera);
 root.dataset.time=t.toFixed(2);if(t<10)announced=false;if(t>=10&&!announced){announced=true;parent.postMessage({type:'oneshot:cube-state',state:'complete'},'*');}
 }
 function stop(){running=false;cancelAnimationFrame(raf);play.textContent='Play 10-second study'}
 play.onclick=()=>{if(running){stop();return}running=true;start=performance.now()-(current>=10?0:current*1000);play.textContent='Pause';const frame=now=>{if(!root.isConnected){stop();return}const t=Math.min(10,(now-start)/1000);draw(t);if(t<10&&running)raf=requestAnimationFrame(frame);else{stop();status.textContent='Organized for judgment · Blue: underwriting · Gold: transaction review'}};raf=requestAnimationFrame(frame)};
 slider.oninput=()=>{stop();draw(+slider.value)};root.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{stop();draw(+b.dataset.time);status.textContent=b.textContent+' · Illustrative transaction notes'});
 new ResizeObserver(()=>{const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.position.z=Math.max(9.2,8.6/(w/h));camera.updateProjectionMatrix();draw(current)}).observe(stage);
 root.querySelectorAll('button,input').forEach(e=>e.disabled=false);draw(0);
 window.addEventListener('message',event=>{
   if(event.source!==parent||event.data?.type!=='oneshot:cube')return;
   if(event.data.action==='start'&&!running)play.click();
   if(event.data.action==='pause')stop();
   if(event.data.action==='finish'){stop();draw(10);}
 });
 parent.postMessage({type:'oneshot:cube-state',state:'ready'},'*');

 // Expose only a compact geometry check for review; no scene mutation API.
 const check=initial.map(p=>({p:p.p.slice(),m:p.m.slice()}));moves.forEach(m=>apply(check,m));root.dataset.solved=String(check.every((p,i)=>p.p.every((v,k)=>v===pieces[i].p[k])&&p.m.every((v,k)=>v===I[k])));
 }catch(error){status.textContent=error.message;const note=root.querySelector('.loading');if(note)note.textContent='Preview unavailable';console.error(error)}
})();
</script>
