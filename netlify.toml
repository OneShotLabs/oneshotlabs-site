[[redirects]]
from = "https://oneshotlens.netlify.app/*"
to = "https://oneshotlens.com/:splat"
status = 301
force = true

[[headers]]
for = "/data/*"

  [headers.values]
  Cache-Control = "public, max-age=300"

[[headers]]
for = "/assets/video/*"

  [headers.values]
  Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/assets/brand/*"

  [headers.values]
  Cache-Control = "public, max-age=604800"

[[headers]]
for = "/sitemap.xml"

  [headers.values]
  Cache-Control = "public, max-age=3600"

[[headers]]
for = "/robots.txt"

  [headers.values]
  Cache-Control = "public, max-age=3600"

[[headers]]
for = "/analytics-dashboard.html"

  [headers.values]
  Cache-Control = "private, no-store"
  X-Robots-Tag = "noindex, nofollow, noarchive"
  X-Frame-Options = "DENY"
  Referrer-Policy = "no-referrer"

[[headers]]
for = "/dashboard"

  [headers.values]
  Cache-Control = "private, no-store"
  X-Robots-Tag = "noindex, nofollow, noarchive"
  X-Frame-Options = "DENY"
  Referrer-Policy = "no-referrer"

[[headers]]
for = "/ai-curve.html"

  [headers.values]
  X-Frame-Options = "SAMEORIGIN"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "strict-origin-when-cross-origin"

