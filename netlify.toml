functionsDirectory = "netlify/functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "."
publishOrigin = "config"
functions = "netlify/functions"

  [build.environment]

  [build.processing]

    [build.processing.css]

    [build.processing.html]

    [build.processing.images]

    [build.processing.js]

  [build.services]

[functions]

  [functions."*"]

[[redirects]]
from = "https://oneshotlabsai.com/*"
to = "https://oneshotlens.com/:splat"
status = 301
force = true

[[redirects]]
from = "https://www.oneshotlabsai.com/*"
to = "https://oneshotlens.com/:splat"
status = 301
force = true

[[redirects]]
