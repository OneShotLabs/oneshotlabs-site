[build]
  publish = "."
  functions = "netlify/functions"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ai-curve.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/blog"
  to = "/musings"
  status = 301

[[redirects]]
  from = "/blog.html"
  to = "/musings"
  status = 301

[[redirects]]
  from = "/musings.html"
  to = "/musings"
  status = 301

[[redirects]]
  from = "/musings/ai-has-a-branding-problem"
  to = "/musings/ai-has-a-branding-problem/index.html"
  status = 200

[[redirects]]
  from = "/musings/systems-thinkers-netflix"
  to = "/musings"
  status = 302
  force = true

[[redirects]]
  from = "/musings/:slug"
  to = "/post.html?slug=:slug"
  status = 200

[[redirects]]
from = "/ai/curve"
to = "/ai-curve.html"
status = 200

[[redirects]]
from = "/ai-consulting"
to = "/ai"
status = 301
force = true

[[redirects]]
from = "/ai-consulting.html"
to = "/ai"
status = 301
force = true

[[redirects]]
from = "/ai.html"
to = "/ai"
status = 301
force = true

[[redirects]]
from = "/ai"
to = "/ai.html"
status = 200
force = true
