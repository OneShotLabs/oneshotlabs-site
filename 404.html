<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | One Shot Labs</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="theme-color" content="#13213F">
</head>
<body style="background-color: #FFFDF8; color: #13213F; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
    <main class="error-container" style="padding: 2rem;">
      <div class="error-content">
        <h1 class="error-code" style="font-family: 'Fraunces', serif; font-size: 6rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -2px;">404</h1>
        <h2 class="error-headline" style="font-family: 'Source Sans 3', sans-serif; font-size: 2rem; margin-bottom: 1rem;">Page not found.</h2>
        <p class="error-text" style="font-family: 'Source Sans 3', sans-serif; margin-bottom: 2rem;">
          The link is broken or the page has been moved. Let's get you back to the consequential work.
        </p>
        <div class="error-actions" style="display: flex; gap: 1rem; justify-content: center;">
          <a href="/" class="button primary" style="background-color: #13213F; color: #FFFDF8; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px;">Return Home</a>
          <a href="/ai-consulting.html" class="button secondary" style="color: #C6A153; padding: 0.75rem 1.5rem; text-decoration: none; border: 1px solid #C6A153; border-radius: 4px;">View AI Consulting</a>
        </div>
      </div>
    </main>
</body>
</html>
