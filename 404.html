<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | One Shot Labs</title>
    <link rel="stylesheet" href="css/style.css?v=20260910-grade">
    <meta name="theme-color" content="#1D2F4E">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap" rel="stylesheet">
</head>
<body style="background-color: #FFFDF8; color: #1D2F4E; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center;">
    <main class="error-container" style="padding: 2rem;">
      <div class="error-content">
        <h1 class="error-code" style="font-family: 'Source Serif 4', Georgia, serif; font-size: 6rem; font-weight: 600; margin-bottom: 0.5rem; letter-spacing: -2px;">404</h1>
        <h2 class="error-headline" style="font-family: 'Source Sans 3', sans-serif; font-size: 2rem; margin-bottom: 1rem;">Page not found.</h2>
        <p class="error-text" style="font-family: 'Source Sans 3', sans-serif; margin-bottom: 2rem;">
          The link is broken or the page has been moved. Let's get you back to the consequential work.
        </p>
        <div class="error-actions" style="display: flex; gap: 1rem; justify-content: center;">
          <a href="/" class="button primary" style="background-color: #1D2F4E; color: #FFFDF8; padding: 0.75rem 1.5rem; text-decoration: none; border-radius: 4px; font-family: 'Source Sans 3', sans-serif;">Return Home</a>
        </div>
      </div>
    </main>
</body>
</html>
